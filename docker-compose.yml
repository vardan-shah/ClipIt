# ClipIt on one server: the app, PostgreSQL, and Caddy for HTTPS.
# Copy .env.example to .env, fill it in, then:  docker compose up -d --build
# A server of its own: also set COMPOSE_PROFILES=own-https in .env. A shared server: see deploy/nginx-clipit.conf.
services:
  db:
    image: postgres:16-alpine
    mem_limit: ${CLIPIT_DB_MEM_LIMIT:-0}
    restart: unless-stopped
    environment:
      POSTGRES_USER: clipit
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: clipit
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U clipit"]
      interval: 10s
      timeout: 5s
      retries: 6

  app:
    build: .
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql+psycopg://clipit:${POSTGRES_PASSWORD}@db:5432/clipit
      CLIPIT_PUBLIC_URL: https://${CLIPIT_DOMAIN:?set CLIPIT_DOMAIN in .env}
      # On a server everyone signs in. Set CLIPIT_ACCOUNTS=0 in .env only if the site is private to you.
      CLIPIT_ACCOUNTS: ${CLIPIT_ACCOUNTS:-1}
    volumes:
      - data:/data
      - ./secrets:/secrets:ro
      - ./.git:/app/.git:ro            # only to tell which version is running, for the update notice
    # Reachable from this server only. On a server that already has a web server, point that one at this port
    # (see deploy/nginx-clipit.conf). With the "own-https" profile, Caddy below is the web server instead.
    ports: ["127.0.0.1:${CLIPIT_BIND_PORT:-8765}:8765"]
    # On a server shared with other apps, these keep ClipIt inside its own share (all unlimited by default):
    # a memory ceiling with no swap, a processor ceiling, a lower turn at the processor when the server is busy,
    # and "stop this one first" if the whole server ever runs out of memory.
    mem_limit: ${CLIPIT_MEM_LIMIT:-0}
    memswap_limit: ${CLIPIT_MEM_LIMIT:-0}
    cpus: ${CLIPIT_CPUS:-0}
    cpu_shares: ${CLIPIT_CPU_SHARES:-1024}
    oom_score_adj: ${CLIPIT_OOM_SCORE_ADJ:-0}

  # Only on a server ClipIt has to itself: add COMPOSE_PROFILES=own-https to .env and Caddy handles HTTPS.
  caddy:
    profiles: ["own-https"]
    image: caddy:2
    restart: unless-stopped
    depends_on: [app]
    ports: ["80:80", "443:443"]
    environment:
      CLIPIT_DOMAIN: ${CLIPIT_DOMAIN}
    volumes:
      # Caddyfile fetches certificates by itself; Caddyfile.origin uses a Cloudflare origin certificate from ./secrets
      - ./deploy/${CLIPIT_CADDYFILE:-Caddyfile}:/etc/caddy/Caddyfile:ro
      - ./secrets:/secrets:ro
      - caddy_data:/data
      - caddy_config:/config

volumes:
  pgdata:
  data:
  caddy_data:
  caddy_config:
